        document.addEventListener('DOMContentLoaded', () => {
            loadCustomAssets();

            lucide.createIcons();
        });

        function updateSyncStatus(text, colorClass) {
            const dot = document.getElementById('firebase-sync-dot');
            const label = document.getElementById('firebase-sync-text');
            if (dot) dot.className = `w-2.5 h-2.5 rounded-full ${colorClass}`;
            if (label) label.textContent = text;
        }

        function initFirestoreListener() {
            try {
                const q = query(collection(db, BRIEFS_COLLECTION), orderBy("createdAt", "desc"));
                onSnapshot(q, (snapshot) => {
                    isFirebaseReady = true;
                    briefs = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                    updateSyncStatus("เชื่อมต่อฐานข้อมูลออนไลน์แล้ว (ซิงก์ทุกเครื่อง)", "bg-emerald-400");
                    renderHomeLists();

                    // หากกำลังเปิดดู PDF ของบรีฟใดอยู่ ให้รีเฟรชข้อมูลอัตโนมัติ
                    if (activeBriefId && !document.getElementById('page-pdf-viewer').classList.contains('hidden')) {
                        renderPdfPreview(activeBriefId);
                    }
                }, (error) => {
                    console.error("Firestore error:", error);
                    updateSyncStatus("รอเปิดใช้งาน Firestore Database (ใช้โหมดสำรองชั่วคราว)", "bg-rose-400");
                    loadBriefsFromLocalFallback();
                });
            } catch (e) {
                console.error("Firebase init error:", e);
                loadBriefsFromLocalFallback();
            }
        }

        function loadBriefsFromLocalFallback() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                briefs = raw ? JSON.parse(raw) : [...DEFAULT_SAMPLE_BRIEFS];
            } catch (e) {
                briefs = [...DEFAULT_SAMPLE_BRIEFS];
            }
            renderHomeLists();
        }

        async function saveBriefToCloud(briefObj) {
            if (isFirebaseReady) {
                try {
                    const docRef = doc(db, BRIEFS_COLLECTION, briefObj.id);
                    await setDoc(docRef, briefObj);
                } catch (e) {
                    console.error("Save error:", e);
                    showToast('บันทึกขึ้น Cloud ไม่สำเร็จ ตรวจสอบสิทธิ์ Firestore Rules', 'error');
                }
            } else {
                const idx = briefs.findIndex(b => b.id === briefObj.id);
                if (idx > -1) briefs[idx] = briefObj;
                else briefs.unshift(briefObj);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(briefs));
                renderHomeLists();
            }
        }

        async function deleteBriefFromCloud(id) {
            if (isFirebaseReady) {
                try {
                    await deleteDoc(doc(db, BRIEFS_COLLECTION, id));
                } catch (e) {
                    console.error("Delete error:", e);
                    showToast('ลบข้อมูลไม่สำเร็จ', 'error');
                }
            } else {
                briefs = briefs.filter(b => b.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(briefs));
                renderHomeLists();
            }
        }
